<!DOCTYPE html>
<html>

<head>
    <title>Attendance System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="ChatGPT Image May 26, 2026, 10_57_50 AM.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.31/dist/jspdf.plugin.autotable.min.js"></script>

    <style>
        body { 
             background:#f4f7fb; 
             padding:5px;
    }

        td,th{
            text-align:center;
            white-space:nowrap;
        }

        .present{
            background:#28a745 !important;
            color:white !important;
            font-weight:bold;
            cursor:pointer;
        }

        .absent{
            background:#dc3545 !important;
            color:white !important;
            font-weight:bold;
            cursor:pointer;
        }

        .box{
            background:white;
            border-radius:10px;
            overflow:auto;
        }

        .action-btn{
            width:80px;
            font-size:11px;
            margin:2px;
        }

        /* Scroll */
        .box{
            overflow-x:auto;
            position: relative;
        }

        /* Common sticky */
        .sticky{
            position: sticky;
            background: white !important;
        }

          /* SR */
        .sticky-sr{
            left: 0;
            width: 50px;
            min-width: 50px;
            max-width: 50px;
            z-index: 20;
        }

       .sticky-name{
        left: 50px;
        width: 160px;
        min-width: 160px;
        max-width: 160px;
        z-index: 20;
    }

        .sticky-salary{
            left: 210px;
            width: 70px;
            min-width: 70px;
            max-width: 70px;
            z-index: 20;
        }


        /* Header */
        thead th{
            position: sticky;
            top: 0;
            background:#212529 !important;
            color:white;
            z-index: 30;
        }

        /* Sticky header fix */
        thead .sticky{
            background:#212529 !important;
            color:white !important;
            z-index: 40;
        }
        @media (max-width: 768px) {

           .sticky-sr{
        width: 45px;
        min-width: 45px;
        max-width: 45px;
        left: 0;
    }

    .sticky-name{
        width: 120px;
        min-width: 120px;
        max-width: 120px;
        left: 45px;
    }
    
    .sticky-salary{
        width: 50px;
        min-width: 50px;
        max-width: 50px;
        left: 165px;
    }
    
    table{
        border-collapse: collapse !important;
    }
    
    thead th,
    tbody td{
        padding: 10px !important;
    }
   
       .action-btn {
           width: 60px;
           font-size: 10px;
       }
}
    </style>
</head>

<body>

<div class="container-fluid">

<h1 class="text-center p-0 m-0">

    <img src="ChatGPT Image May 26, 2026, 10_57_50 AM.png"
    width="400"
    height="400"
    style="border-radius:12px; display:block; margin:auto;">
</h1>

    <div class="row g-2 mb-3">

    <div class="row g-2 mt-0 mb-3">

    <div class="col-12 col-md-3">
        <input id="name" class="form-control" placeholder="Staff Name">
    </div>

    <div class="col-12 col-md-2">
        <input id="salary" class="form-control" type="number" value="700">
    </div>

    <div class="col-6 col-md-2">
        <input id="yearInput" class="form-control" placeholder="Year">
    </div>

    <div class="col-6 col-md-2">
        <select id="monthSelect" class="form-select"></select>
    </div>

    <div class="col-12 col-md-3">
        <input id="searchInput"
        class="form-control"
        placeholder="Search Staff"
        oninput="render()"> 
   </div>

    <div class="col-12">
        <button class="btn btn-primary w-100" onclick="addStaff()">Add Staff</button>
    </div>

</div>
    </div>

   <div class="d-flex flex-wrap gap-2 mb-2 justify-content-center">
    <button class="btn btn-dark btn-sm flex-fill" onclick="showHistory()">Delete History</button>
    <button class="btn btn-success btn-sm flex-fill" onclick="downloadAllPDF()">All PDF</button>
    <button class="btn btn-warning btn-sm flex-fill" onclick="showDeleted()">Restore</button>
   </div>

    <div class="box">
        <table class="table table-bordered">
            <thead class="table-dark" id="thead"></thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

</div>

<script>

// ================= DATA =================
let staff = JSON.parse(localStorage.getItem("staff")) || [];
let deletedHistory = JSON.parse(localStorage.getItem("deletedHistory")) || [];

let searchText = "";

// ================= MONTH =================
const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const monthSelect=document.getElementById("monthSelect");

months.forEach((m,i)=>{
    monthSelect.innerHTML += `<option value="${i}">${m}</option>`;
});

monthSelect.value=new Date().getMonth();
document.getElementById("yearInput").value=new Date().getFullYear();

// ================= HELP =================
function getDays(m,y){
    return new Date(y,m+1,0).getDate();
}

// ================= SAVE =================
function save(){
    localStorage.setItem("staff",JSON.stringify(staff));
    localStorage.setItem("deletedHistory",JSON.stringify(deletedHistory));
}

// ================= ADD =================
function addStaff(){

    let name=document.getElementById("name").value.trim();
    let salary=Number(document.getElementById("salary").value)||700;

    if(!name) return alert("Enter name");

    staff.push({name,salary,attendance:{}});
    save();
    render();
}

// ================= TOGGLE =================
function toggle(i,y,m,d){

    if(!staff[i].attendance[y]) staff[i].attendance[y]={};
    if(!staff[i].attendance[y][m])
        staff[i].attendance[y][m]=new Array(getDays(m,y)).fill("A");

    staff[i].attendance[y][m][d] =
        staff[i].attendance[y][m][d]==="P"?"A":"P";

    save();
    render();
}

// ================= EDIT =================
function editSalary(i){

    let s = prompt("Enter salary:", staff[i].salary);

    if(s === null) return;

    s = Number(s);

    if(isNaN(s) || s <= 0) return alert("Invalid");

    staff[i].salary = s;
    save();
    render();
}

// ================= DELETE + HISTORY =================
function removeStaff(i){

    deletedHistory.push({
        name: staff[i].name,
        salary: staff[i].salary,
        attendance: staff[i].attendance,
        deletedAt: new Date().toLocaleString()
    });

    staff.splice(i,1);
    save();
    render();
}

// ================= HISTORY =================
function showHistory(){

    let text="DELETE HISTORY\n\n";

    deletedHistory.forEach((s,i)=>{
        text+=`${i+1}. ${s.name} | ₹${s.salary} | ${s.deletedAt}\n`;
    });

    alert(text);
}

// ================= RESTORE =================
function showDeleted(){

    let name=prompt("Enter name to restore:");

    let i=deletedHistory.findIndex(s=>s.name===name);

    if(i===-1) return alert("Not found");

    staff.push(deletedHistory[i]);

    deletedHistory.splice(i,1);

    save();
    render();
}

// ================= SINGLE PDF =================
function downloadPDF(i){

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    let s = staff[i];
    if(!s){
    alert("Staff not found");
    return;
  }

    let y = Number(document.getElementById("yearInput").value);
    let m = Number(document.getElementById("monthSelect").value);

 let p = 0;
let a = 0; 
    let rows=[];

    const dayNames=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

    for(let d=0; d<getDays(m,y); d++){

        let val = s.attendance?.[y]?.[m]?.[d] || "A";

        if(val==="P") p++; else a++;

        let dateObj = new Date(y,m,d);

        rows.push([
            dateObj.toLocaleDateString("en-GB"),
            dayNames[dateObj.getDay()],
            val,
            s.salary,
            val==="P" ? s.salary : 0
        ]);
    }

    doc.text(`Name: ${s.name}`,14,15);
    doc.text(`Salary: ${s.salary}`,14,22);
    doc.text(`P:${p} A:${a}`,14,29);
    doc.text(`Total: ${p*s.salary}`,14,36);

    doc.autoTable({
        startY:45,
        head:[["Date","Day","A/P","Salary","Earned"]],
        body:rows
    });

    // 🔥 IMPORTANT FIX
   const blob = doc.output("blob");
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download = `${s.name}_attendance.pdf`;

    document.body.appendChild(link);

    setTimeout(() => {
        link.click();
    }, 50);   // 🔥 IMPORTANT DELAY

    setTimeout(() => {
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }, 1000);
}

// ================= ALL STAFF PDF =================
function downloadAllPDF(){

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    let y = Number(document.getElementById("yearInput").value);
    let m = Number(document.getElementById("monthSelect").value);

    const dayNames=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

    let yPos = 15;

    staff.forEach((s,i)=>{

        let p=0,a=0;
        let rows=[];

        for(let d=0; d<getDays(m,y); d++){

            let val = s.attendance?.[y]?.[m]?.[d] || "A";

            if(val==="P") p++; else a++;

            let dateObj = new Date(y,m,d);

            rows.push([
                dateObj.toLocaleDateString("en-GB"),
                dayNames[dateObj.getDay()],
                val,
                s.salary,
                val==="P" ? s.salary : 0
            ]);
        }

        doc.text(`${i+1}. ${s.name} | ₹${s.salary}`,10,yPos);
        doc.text(`P:${p} A:${a} Total:${p*s.salary}`,10,yPos+6);

        doc.autoTable({
            startY:yPos+12,
            head:[["Date","Day","A/P","Salary","Earned"]],
            body:rows
        });

        yPos = doc.lastAutoTable.finalY + 10;

        if(yPos > 260){
            doc.addPage();
            yPos = 15;
        }
    });

    const blob = doc.output("blob");
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "All_Staff_Attendance.pdf";
    document.body.appendChild(a);
    a.click();

  setTimeout(() => {
    link.click();
}, 50);
}

// ================= RENDER =================
function render(){

     let y=Number(yearInput.value);
     let m=Number(monthSelect.value);

    searchText = document.getElementById("searchInput")?.value?.toLowerCase() || "";

    let head=`<tr>
    <th class="sticky sticky-sr">SR</th>
    <th class="sticky sticky-name">Name</th>
    <th class="sticky sticky-salary">Salary</th>`;

    for(let d=1; d<=getDays(m,y); d++)
        head+=`<th>${d}</th>`;

    head+=`<th>P</th><th>A</th><th>Total</th><th>Action</th></tr>`;

    thead.innerHTML=head;

    let body="";

    let filteredStaff = staff.filter(s =>
    s.name.toLowerCase().includes(searchText)
    );

  filteredStaff.forEach((s)=>{

    let i = staff.indexOf(s);

    let p=0,a=0;

    let row=`<tr>
    <td class="sticky sticky-sr">${i+1}</td>
    <td class="sticky sticky-name">${s.name}</td>
    <td class="sticky sticky-salary">${s.salary}</td>`;

    for(let d=0; d<getDays(m,y); d++){

        let val=s.attendance?.[y]?.[m]?.[d]||"A";

        if(val==="P") p++; else a++;

        row+=`
        <td class="${val==="P"?"present":"absent"}"
        onclick="toggle(${i},${y},${m},${d})">${val}</td>`;
    }

    row+=`
    <td>${p}</td>
    <td>${a}</td>
    <td>${p*s.salary}</td>
    <td>
        <button class="btn btn-warning action-btn" onclick="editSalary(${i})">Edit Salary</button>
        <button class="btn btn-primary action-btn" onclick="downloadPDF(${i})">PDF</button>
        <button class="btn btn-danger action-btn" onclick="removeStaff(${i})">Delete</button>
    </td>
    </tr>`;

    body+=row;
});

    tbody.innerHTML=body;
}

// ================= EVENTS =================
monthSelect.onchange=render;
yearInput.oninput=render;

// ================= INIT =================
render();

</script>

</body>
</html>
