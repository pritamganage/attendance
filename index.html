<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Staff Attendance System</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f4f7fb;
    }

    /* ✅ RESPONSIVE TABLE WRAPPER */
    .table-container {
      overflow-x: auto;
      overflow-y: auto;
      max-height: 75vh;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
    }

    /* ✅ TABLE TEXT + SPACING */
    th,
    td {
      text-align: center;
      font-size: 13px;
      white-space: nowrap;
      padding: 10px 12px;
    }

    /* ✅ TOUCH FRIENDLY CELLS */
    .present,
    .absent {
      min-width: 40px;
      min-height: 40px;
      font-weight: 600;
      cursor: pointer;
    }

    .present {
      background: #198754 !important;
      color: white !important;
    }

    .absent {
      background: #dc3545 !important;
      color: white !important;
    }

    /* ✅ STICKY NAME COLUMN */
    .name-col {
      position: sticky;
      left: 0;
      background: white;
      z-index: 3;
      font-weight: bold;
      min-width: 140px;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
    }

    /* ✅ MOBILE RESPONSIVENESS */
    @media (max-width: 768px) {

      th,
      td {
        font-size: 11px;
        padding: 6px 8px;
      }

      .present,
      .absent {
        min-width: 34px;
        min-height: 34px;
        font-size: 12px;
      }

      .name-col {
        min-width: 110px;
      }

      h3 {
        font-size: 18px;
      }
    }

    /* EXTRA SMALL DEVICES */
    @media (max-width: 480px) {

      th,
      td {
        font-size: 10px;
        padding: 5px;
      }

      .present,
      .absent {
        min-width: 30px;
        min-height: 30px;
      }

      .name-col {
        min-width: 100px;
      }
    }
  </style>
</head>

<body>
  <!-- Firebase -->
  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      deleteDoc,
      doc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {

      apiKey: "AIzaSy......",

      authDomain: "attendance-app-2fb08.firebaseapp.com",

      projectId: "attendance-app-2fb08",

      storageBucket: "attendance-app-2fb08.appspot.com",

      messagingSenderId: "745483950546",

      appId: "1:745483950546:web:......"

    };

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    window.db = db;
    window.firebaseFns = {
      collection,
      addDoc,
      getDocs,
      deleteDoc,
      doc,
      updateDoc
    };

  </script>

  <div class="container-fluid py-3">

    <h3 class="text-center text-primary mb-3">
      Monthly Staff Attendance System
    </h3>

    <!-- Controls -->
    <div class="row g-2 mb-3">

      <div class="col-12 col-md-4">
        <input id="staffName" class="form-control" placeholder="Enter staff name">
      </div>

      <div class="col-6 col-md-3">
        <select id="monthSelect" class="form-select" onchange="render()"></select>
      </div>

      <div class="col-6 col-md-3">
        <input id="search" class="form-control" placeholder="Search staff..." onkeyup="render()">
      </div>

      <div class="col-12 col-md-2">
        <button class="btn btn-primary w-100" onclick="addStaff()">
          Add
        </button>
      </div>

    </div>

    <div class="table-container">

      <table class="table table-bordered">

        <thead class="table-dark" id="tableHead"></thead>

        <tbody id="staffList"></tbody>

      </table>

    </div>

  </div>

  <script>

    let staff = JSON.parse(localStorage.getItem("staff")) || [];

    const year = new Date().getFullYear();

    const months = [
      "Jan", "Feb", "Mar", "Apr", "May", "Jun",
      "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"
    ];

    const monthSelect = document.getElementById("monthSelect");

    months.forEach((m, i) => {
      monthSelect.innerHTML += `<option value="${i}">${m}</option>`;
    });

    function getDays(m) {
      return new Date(year, m + 1, 0).getDate();
    }

    function saveData() {
      localStorage.setItem("staff", JSON.stringify(staff));
    }

    function addStaff() {

      const name = document.getElementById("staffName").value.trim();

      if (name === "") {
        alert("Enter staff name");
        return;
      }

      let attendance = new Array(12).fill(null).map((_, m) =>
        new Array(getDays(m)).fill("A")
      );

      staff.push({ name, attendance });

      document.getElementById("staffName").value = "";

      saveData();
      render();
    }

    function toggle(i, d, m) {

      staff[i].attendance[m][d] =
        staff[i].attendance[m][d] === "P" ? "A" : "P";

      saveData();
      render();
    }

    function removeStaff(i) {
      staff.splice(i, 1);
      saveData();
      render();
    }

    function generateHeader(month) {

      let head = `<tr>
    <th class="name-col">Staff</th>
  `;

      for (let d = 1; d <= getDays(month); d++) {
        head += `<th>${months[month]}-${d}</th>`;
      }

      head += `
    <th>Total P</th>
    <th>Total A</th>
    <th>Action</th>
  </tr>`;

      document.getElementById("tableHead").innerHTML = head;
    }

    function render() {

      const month = parseInt(monthSelect.value);
      const search = document.getElementById("search").value.toLowerCase();

      generateHeader(month);

      const body = document.getElementById("staffList");
      body.innerHTML = "";

      staff.forEach((s, i) => {

        if (!s.name.toLowerCase().includes(search)) return;

        let p = 0, a = 0;

        let row = `<tr>
      <td class="name-col">${s.name}</td>
    `;

        for (let d = 0; d < getDays(month); d++) {

          let val = s.attendance[month][d];

          if (val === "P") p++;
          else a++;

          row += `
        <td class="${val === "P" ? "present" : "absent"}"
            onclick="toggle(${i},${d},${month})">
          ${val}
        </td>
      `;
        }

        row += `
      <td class="text-success fw-bold">${p}</td>
      <td class="text-danger fw-bold">${a}</td>
      <td>
        <button class="btn btn-danger btn-sm" onclick="removeStaff(${i})">
          Delete
        </button>
      </td>
    </tr>`;

        body.innerHTML += row;
      });
    }

    render();

  </script>

</body>

</html>
